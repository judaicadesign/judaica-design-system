&lt;style&gt;/* Existing application styles, preserved in their original order. */
:root{--bg:#f4f0e8;--panel:#fbf9f4;--ink:#262421;--muted:#7c746a;--line:#ded6c8;--accent:#175f60;--accent2:#b18a4b;--ok:#41745d;--warn:#9a6a2d;--danger:#a44b46;--soft:#ebe5da}
*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.sidebar{background:#1e4f50;color:#fff;padding:26px 18px;position:sticky;top:0;height:100vh}
.brand{font-size:21px;font-weight:800;letter-spacing:.04em;margin:4px 8px 28px}.brand small{display:block;font-size:10px;opacity:.65;font-weight:600;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:5px}.nav button{border:0;background:transparent;color:#dcebea;text-align:left;padding:11px 12px;border-radius:10px}.nav button:hover,.nav button.active{background:rgba(255,255,255,.12);color:#fff}.nav .sep{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:#9fc1c0;margin:18px 12px 7px}
.main{padding:34px;max-width:1480px;width:100%}
.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}h1{font-size:38px;line-height:1.05;margin:5px 0 0}.btn{border:1px solid var(--line);background:var(--panel);padding:10px 14px;border-radius:10px;color:var(--ink)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.gold{background:var(--accent2);color:#fff;border-color:var(--accent2)}.btn.ghost{background:transparent}.btn.sm{padding:7px 10px;font-size:13px}
.grid{display:grid;gap:18px}.grid.cards{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.metric{font-size:31px;font-weight:800;margin-top:8px}.muted{color:var(--muted)}.small{font-size:13px}.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 9px;font-size:12px;background:var(--soft);color:var(--muted)}.tag.ok{background:#e1eee6;color:var(--ok)}.tag.warn{background:#f5ead9;color:var(--warn)}.tag.danger{background:#f3dedb;color:var(--danger)}
.section{margin-top:26px}.section-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:12px}.section h2{font-size:22px;margin:0}.table{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}.table th,.table td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:#f2ede4}.table tr:last-child td{border-bottom:0}.price{font-weight:800}
.screen{display:none}.screen.active{display:block}
.product-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.product-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.product-visual{height:165px;background:linear-gradient(135deg,#d8d0c0,#f5f2eb);display:grid;place-items:center;position:relative}.book{width:92px;height:128px;background:#fff;border:1px solid #d3ccc0;box-shadow:10px 10px 18px #bdb5a6;display:grid;place-items:center;font-family:Georgia,serif;color:#777}.book.big{width:106px;height:140px}.product-body{padding:16px}.product-body h3{margin:0 0 6px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}.field textarea{min-height:95px;resize:vertical}.span2{grid-column:1/-1}
.quote-layout{display:grid;grid-template-columns:1.08fr .92fr;gap:20px}.quote-preview{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;min-height:760px}.quote-preview .hero{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}.mock{background:#ece6da;border-radius:14px;min-height:300px;display:flex;align-items:center;justify-content:center}.mock .book{transform:scale(1.35)}.spec{border:1px solid var(--line);border-radius:14px;overflow:hidden}.spec-row{display:grid;grid-template-columns:135px 1fr;border-bottom:1px solid var(--line)}.spec-row:last-child{border-bottom:0}.spec-row div{padding:11px}.spec-row div:first-child{background:#f4efe6;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.07em}.quote-prices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:18px}.quote-price{border:1px solid var(--line);border-radius:12px;padding:14px}.quote-price strong{font-size:24px;display:block;margin-top:4px}.legal{font-size:9.5px;line-height:1.45;color:#5f5951;columns:2;column-gap:24px;border-top:1px solid var(--line);padding-top:14px;margin-top:18px}
.index-box{margin-top:18px;border:1px solid var(--line);border-radius:14px;padding:18px;background:#fbfaf7}.index-box h4{font-family:Georgia,serif;font-size:25px;margin:0 0 10px;color:var(--accent2)}.index-list{columns:2;column-gap:28px;font-size:12px;line-height:1.55}
.rule{display:grid;grid-template-columns:1.2fr 1fr .8fr auto;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.rule:last-child{border-bottom:0}
.master{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}.master-diff{margin-top:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden}.diff-row{display:grid;grid-template-columns:110px 1fr;padding:9px 11px;border-bottom:1px solid var(--line);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.diff-row:last-child{border-bottom:0}.diff-row .label{color:var(--muted);font-family:Inter,system-ui}.old{background:#fae9e6}.new{background:#e8f2ea}
.notice{padding:12px 14px;border-radius:10px;background:#fff2d8;border:1px solid #e6d1a7;color:#79561c;margin-bottom:18px}

;option&gt;Presupuesto aprobado · esperando pago&lt;/option&gt;&lt;option&gt;Pago realizado · iniciar diseño&lt;/option&gt;&lt;option&gt;Diseño en curso&lt;/option&gt;&lt;option&gt;Borrador / Calaméo / mockup enviado&lt;/option&gt;&lt;option&gt;Correcciones del cliente&lt;/option&gt;&lt;option&gt;Aprobado por cliente · revisión interna / master&lt;/option&gt;&lt;option&gt;Listo para imprenta&lt;/option&gt;&lt;option&gt;En imprenta&lt;/option&gt;&lt;option&gt;Retirado de imprenta · listo para entregar&lt;/option&gt;&lt;option&gt;Entregado&lt;/option&gt;&lt;option&gt;Cerrado · no avanzó&lt;/option&gt;&lt;/select&gt;&lt;/td&gt;&lt;td data-label=&quot;Último movimiento&quot;&gt;&lt;b&gt;Estado&lt;/b&gt;&lt;div class=&quot;small muted&quot;&gt;07/10/26, 06:56 p. m.&lt;/div&gt;&lt;/td&gt;&lt;td class=&quot;jd-crm-next&quot; data-label=&quot;Próxima acción&quot;&gt;—&lt;/td&gt;&lt;td data-label=&quot;Pago&quot;&gt;&lt;span class=&quot;jd-crm-badge danger&quot;&gt;Pendiente&lt;/span&gt;&lt;/td&gt;&lt;td data-label=&quot;Acciones&quot;&gt;&lt;div class=&quot;jd-crm-actions&quot;&gt;&lt;button class=&quot;btn sm&quot; data-open=&quot;1&quot; disabled=&quot;&quot;&gt;Abrir ficha&lt;/button&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;screen&quot; id=&quot;costs&quot;&gt;&lt;div class=&quot;topbar&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Costos&lt;/div&gt;&lt;h1&gt;Proveedores &amp;amp; cotizaciones&lt;/h1&gt;&lt;/div&gt;&lt;button class=&quot;btn primary&quot; id=&quot;ac4&quot; disabled=&quot;&quot;&gt;+ Cargar cotización&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;Configuración general de proveedores&lt;/h2&gt;&lt;/div&gt;&lt;div class=&quot;grid cards&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;b&gt;Zloto&lt;/b&gt;&lt;p class=&quot;small muted&quot;&gt;Producción: 2 semanas&lt;/p&gt;&lt;p style=&quot;margin:10px 0 12px&quot;&gt;&lt;span class=&quot;small muted&quot;&gt;Envío general&lt;/span&gt;&lt;br&gt;&lt;strong style=&quot;font-size:22px;color:#0f5b5d&quot;&gt;$ 10.000&lt;/strong&gt;&lt;/p&gt;&lt;button class=&quot;btn sm&quot; data-supplier-edit=&quot;Zloto&quot; disabled=&quot;&quot;&gt;Editar proveedor&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;section&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;h2&gt;Cotizaciones de imprenta&lt;/h2&gt;&lt;span class=&quot;small muted&quot;&gt;1 especificación con precio de más de 30 días&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;jd-table-scroll&quot;&gt;&lt;table class=&quot;table jd-cost-table&quot; data-jd-ui-ready=&quot;true&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Proveedor&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Producto&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Especificación&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Cantidades / costos&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Vigencia&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr class=&quot;jd-cost-stale&quot; data-cost-stale=&quot;1&quot;&gt;&lt;td data-label=&quot;Proveedor&quot;&gt;&lt;b&gt;Zloto&lt;/b&gt;&lt;/td&gt;&lt;td data-label=&quot;Producto&quot;&gt;Birkón · Librito&lt;/td&gt;&lt;td data-label=&quot;Especificación&quot;&gt;Normal · 11,6 × 15,5 cm · Abrochado · 24 págs&lt;/td&gt;&lt;td data-label=&quot;Cantidades / costos&quot;&gt;&lt;div class=&quot;jd-cost-qtys&quot;&gt;&lt;button class=&quot;jd-cost-qty&quot; data-ce=&quot;0&quot; title=&quot;Editar esta tirada&quot; disabled=&quot;&quot;&gt;&lt;b&gt;50 u.&lt;/b&gt;&lt;span&gt;$ 100.000&lt;/span&gt;&lt;small&gt;2026-07-01&lt;/small&gt;&lt;/button&gt;&lt;button class=&quot;jd-cost-qty&quot; data-ce=&quot;1&quot; title=&quot;Editar esta tirada&quot; disabled=&quot;&quot;&gt;&lt;b&gt;100 u.&lt;/b&gt;&lt;span&gt;$ 180.000&lt;/span&gt;&lt;small&gt;2026-07-01&lt;/small&gt;&lt;/button&gt;&lt;button class=&quot;jd-cost-qty&quot; data-ce=&quot;2&quot; title=&quot;Editar esta tirada&quot; disabled=&quot;&quot;&gt;&lt;b&gt;200 u.&lt;/b&gt;&lt;span&gt;$ 330.000&lt;/span&gt;&lt;small&gt;2026-07-01&lt;/small&gt;&lt;/button&gt;&lt;button class=&quot;btn sm&quot; type=&quot;button&quot; disabled=&quot;&quot;&gt;Estimar ajuste · 50 u.&lt;/button&gt;&lt;button class=&quot;btn sm&quot; type=&quot;button&quot; disabled=&quot;&quot;&gt;Estimar ajuste · 100 u.&lt;/button&gt;&lt;button class=&quot;btn sm&quot; type=&quot;button&quot; disabled=&quot;&quot;&gt;Estimar ajuste · 200 u.&lt;/button&gt;&lt;/div&gt;&lt;/td&gt;&lt;td data-label=&quot;Vigencia&quot;&gt;&lt;span class=&quot;tag danger&quot;&gt;Actualizar · 98 días&lt;/span&gt;&lt;div class=&quot;small muted&quot;&gt;2026-07-01&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;screen&quot; id=&quot;rules&quot;&gt;&lt;div class=&quot;topbar&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Motor comercial&lt;/div&gt;&lt;h1&gt;Reglas de precio&lt;/h1&gt;&lt;/div&gt;&lt;button class=&quot;btn primary&quot; id=&quot;nr4&quot; disabled=&quot;&quot;&gt;+ Nueva regla&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;jd-note&quot; style=&quot;margin-bottom:14px&quot;&gt;Las reglas están &lt;b&gt;vinculadas&lt;/b&gt; al producto y, cuando corresponde, a una variante. No son texto libre: el presupuesto las aplica automáticamente.&lt;/div&gt;&lt;div class=&quot;jd-table-wrap&quot;&gt;&lt;table class=&quot;table&quot; data-jd-ui-ready=&quot;true&quot;&gt;&lt;thead&gt;&lt;tr&gt;&lt;th scope=&quot;col&quot;&gt;Producto&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Variante&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Ganancia objetivo&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Fórmula interna&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;Envío&lt;/th&gt;&lt;th scope=&quot;col&quot;&gt;&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;&lt;tr&gt;&lt;td data-label=&quot;Producto&quot;&gt;&lt;b&gt;Birkón · Librito&lt;/b&gt;&lt;/td&gt;&lt;td data-label=&quot;Variante&quot;&gt;Classic&lt;/td&gt;&lt;td data-label=&quot;Ganancia objetivo&quot;&gt;&lt;b&gt;50%&lt;/b&gt; del precio&lt;/td&gt;&lt;td class=&quot;small muted&quot; data-label=&quot;Fórmula interna&quot;&gt;Costo ÷ 0,5&lt;/td&gt;&lt;td data-label=&quot;Envío&quot;&gt;$ 10.000&lt;div class=&quot;small muted&quot;&gt;Zloto&lt;/div&gt;&lt;button class=&quot;btn sm&quot; data-rule-supplier=&quot;Zloto&quot; disabled=&quot;&quot;&gt;Editar envío&lt;/button&gt;&lt;/td&gt;&lt;td data-label=&quot;Acciones&quot;&gt;&lt;button class=&quot;btn sm&quot; data-pr=&quot;0&quot; disabled=&quot;&quot;&gt;Editar&lt;/button&gt;&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;screen&quot; id=&quot;assets&quot;&gt;&lt;div class=&quot;topbar&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Biblioteca visual&lt;/div&gt;&lt;h1&gt;Assets&lt;/h1&gt;&lt;/div&gt;&lt;button class=&quot;btn primary&quot; id=&quot;jdAddAsset&quot; disabled=&quot;&quot;&gt;+ Subir asset&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;jd-note&quot;&gt;Cada asset se etiqueta por &lt;b&gt;producto + función + variante&lt;/b&gt;. Al armar un presupuesto, el sistema busca primero un asset específico que coincida con la configuración; si no encuentra, usa uno general de la familia.&lt;/div&gt;&lt;div class=&quot;product-grid&quot; style=&quot;margin-top:16px&quot;&gt;&lt;div class=&quot;card&quot;&gt;&lt;p class=&quot;muted&quot;&gt;Todavía no cargaste assets reales. Subilos acá y quedarán disponibles para el equipo y para los presupuestos.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;screen&quot; id=&quot;masters&quot;&gt;&lt;div class=&quot;topbar&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Editorial&lt;/div&gt;&lt;h1&gt;Masters &amp;amp; desarrollo del catálogo&lt;/h1&gt;&lt;/div&gt;&lt;button class=&quot;btn primary&quot; id=&quot;jdAddItem&quot; disabled=&quot;&quot;&gt;+ Nuevo ítem de contenido&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;jd-note&quot;&gt;&lt;b&gt;Master modular:&lt;/b&gt; cada renglón del índice es un ítem independiente. Ese ítem puede tener versiones por nusaj y por idioma. Los productos comerciales se construyen combinando estos ítems; así una corrección de un Master puede propagarse a todos los productos que lo usan.&lt;/div&gt;&lt;div class=&quot;product-grid&quot; style=&quot;margin-top:16px&quot;&gt;&lt;div class=&quot;master-card jd-click&quot; data-item=&quot;0&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Birkón&lt;/div&gt;&lt;h3&gt;Birkat Hamazón&lt;/h3&gt;&lt;p class=&quot;small muted&quot;&gt;3 nusajim · 3 idiomas · 9 Masters posibles&lt;/p&gt;&lt;div class=&quot;jd-completion&quot;&gt;&lt;span style=&quot;width:11%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;1/9 aprobados&lt;/p&gt;&lt;button class=&quot;btn sm&quot; disabled=&quot;&quot;&gt;Abrir matriz&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;master-card jd-click&quot; data-item=&quot;1&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;Birkot Hashajar&lt;/div&gt;&lt;h3&gt;Birkot Hashajar&lt;/h3&gt;&lt;p class=&quot;small muted&quot;&gt;1 nusajim · 3 idiomas · 3 Masters posibles&lt;/p&gt;&lt;div class=&quot;jd-completion&quot;&gt;&lt;span style=&quot;width:0%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;0/3 aprobados&lt;/p&gt;&lt;button class=&quot;btn sm&quot; disabled=&quot;&quot;&gt;Abrir matriz&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;master-card jd-click&quot; data-item=&quot;2&quot;&gt;&lt;div class=&quot;eyebrow&quot;&gt;General&lt;/div&gt;&lt;h3&gt;Hadlakat Nerot&lt;/h3&gt;&lt;p class=&quot;small muted&quot;&gt;3 nusajim · 3 idiomas · 9 Masters posibles&lt;/p&gt;&lt;div class=&quot;jd-completion&quot;&gt;&lt;span style=&quot;width:0%&quot;&gt;&lt;/span&gt;&lt;/div&gt;&lt;p class=&quot;small&quot;&gt;0/9 aprobados&lt;/p&gt;&lt;button class=&quot;btn sm&quot; disabled=&quot;&quot;&gt;Abrir matriz&lt;/button&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section class=&quot;screen&quot; id=&quot;legal&quot;&gt;&lt;div class=&quot;topbar&quot;&gt;&lt;div&gt;&lt;div class=&quot;eyebrow&quot;&gt;Plantillas por producto&lt;/div&gt;&lt;h1&gt;Legales &amp;amp; aclaraciones&lt;/h1&gt;&lt;/div&gt;&lt;button class=&quot;btn primary&quot; id=&quot;jdLegalNew&quot; disabled=&quot;&quot;&gt;+ Crear nuevo&lt;/button&gt;&lt;/div&gt;&lt;details class=&quot;card jd-legal-document jd-legal-module&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;jd-legal-module-name&quot;&gt;Legales &amp;amp; aclaraciones Birkonim&lt;/span&gt;&lt;span class=&quot;small muted jd-legal-module-hint&quot;&gt;15 cláusulas · Ver texto completo&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;jd-legal-chevron&quot; aria-hidden=&quot;true&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;jd-legal-module-body&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;p class=&quot;small muted&quot;&gt;Plantilla compartida por los productos que la tengan vinculada.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-legal-edit=&quot;legal-birkonim&quot; disabled=&quot;&quot;&gt;Editar texto completo&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;jd-legal-copy&quot;&gt;&lt;section&gt;&lt;h3&gt;Fotografías&lt;/h3&gt;&lt;p&gt;No están estipuladas en el presupuesto sesiones de fotos ni compras en bancos de imágenes.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Tipografías&lt;/h3&gt;&lt;p&gt;No está estipulada en el presupuesto la compra de tipografías.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Logotipo&lt;/h3&gt;&lt;p&gt;No está estipulado en el presupuesto el diseño, creación o edición del logotipo del evento.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Confidencialidad&lt;/h3&gt;&lt;p&gt;El presente presupuesto tiene carácter confidencial y es propiedad exclusiva del cliente solicitante. Queda prohibida su reproducción, publicación y/o reenvío, total o parcial, a terceras personas.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Redes sociales&lt;/h3&gt;&lt;p&gt;El diseñador conserva el derecho no exclusivo, perpetuo y global de mostrar, reproducir y distribuir los diseños en redes sociales y el sitio web del diseñador, y en publicaciones comerciales, premios o exhibiciones de terceros, con el único fin de promover o ejemplificar el trabajo del diseñador, y el derecho de ser acreditado con la propiedad de los derechos de autor y la autoría de los diseños en relación con dicho uso.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Archivos editables&lt;/h3&gt;&lt;p&gt;No está estipulada la entrega de archivos editables, son propiedad exclusiva del diseñador.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Archivos PDF&lt;/h3&gt;&lt;p&gt;No está estipulada la entrega del archivo PDF, son propiedad exclusiva del diseñador.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Impresión&lt;/h3&gt;&lt;p&gt;Será llevada a cabo por el diseñador. No está autorizada la copia o impresión de más ejemplares a los solicitados. El incumplimiento del presente inciso es violatorio tanto de la ley civil como halájica y habilita al diseñador a iniciar las acciones legales correspondientes.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Plazo de diseño&lt;/h3&gt;&lt;p&gt;El plazo de diseño es de 3 días hábiles para los modelos estándar y de 5 días hábiles para los modelos DELUXE. Este plazo comienza a contarse únicamente una vez que el cliente ha abonado el pedido y enviado toda la información necesaria, incluyendo: tarjeta de invitación o save the date, especificaciones estéticas, nombres y fechas, dedicatorias o leilui nishmat y, en el caso de los modelos DELUXE, las canciones que deberán incorporarse al interior. Este plazo contempla la elaboración del diseño y una instancia de revisión básica. En caso de recibir información incompleta o modificaciones posteriores, los plazos podrán ajustarse en consecuencia.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Plazo de impresión&lt;/h3&gt;&lt;p&gt;En los productos tipo folleto (tríptico, cuadríptico, etc.) el plazo de impresión es de 4 días hábiles. En los productos tipo librito, el plazo de impresión es de 14 días hábiles. Estos plazos corresponden exclusivamente a los tiempos de imprenta y no pueden reducirse ni garantizarse su ejecución antes del plazo indicado, ya que dependen de procesos externos.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Prioridad de agenda&lt;/h3&gt;&lt;p&gt;Pedidos con fechas cercanas al evento que requieran prioridad en la agenda de diseño estarán sujetos a un cargo adicional equivalente al 30 % del valor normal, aplicable cuando el plazo disponible para desarrollar y cerrar el diseño sea menor al mencionado en Plazo de diseño.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Revisión de textos&lt;/h3&gt;&lt;p&gt;El cliente es responsable de revisar cuidadosamente nombres, fechas, dedicatorias, canciones y cualquier otro texto incluido en el diseño. Una vez aprobado el diseño final para impresión, no será posible realizar modificaciones ni será asumida responsabilidad por parte del diseñador por errores que hayan pasado inadvertidos en la revisión.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Canciones (Modelo DELUXE)&lt;/h3&gt;&lt;p&gt;Las canciones deben enviarse en formato texto o imagen con la letra de la canción requerida. No se incluye transcripción desde audios u otros formatos. Las canciones deben enviarse junto con el resto de la información necesaria para el diseño. La cantidad de canciones incluidas estará sujeta al espacio disponible en las páginas destinadas a tal fin (págs. 70 a 86). En caso de exceder el espacio disponible, se solicitará al cliente definir qué canciones desea incluir. Del mismo modo, si quedara espacio disponible, el cliente podrá optar por agregar canciones adicionales dentro del plazo de diseño.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Forma y lugar de pago&lt;/h3&gt;&lt;p&gt;La ejecución del presente contrato comenzará al abonarse el 100% del monto total. Los pagos se efectuarán del modo y en el lugar indicados por el oferente. Se aceptan pagos en efectivo, transferencia bancaria, USDT (al valor Venta P2P de Binance en el momento del pago), Zelle o USD (al valor precio del dólar en Brubank al momento del pago).&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Vigencia del precio&lt;/h3&gt;&lt;p&gt;La tarifa propuesta tiene por el plazo de 7 días corridos. Vencido el plazo de vigencia del precio sin haberse abonado el presupuesto, el monto será plausible de ajuste o actualización. Una vez abonado el presupuesto, se dará inmediato comienzo al trabajo con el objetivo de terminar la etapa de diseño, para luego proceder a imprenta con la mayor celeridad posible.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;details class=&quot;card jd-legal-document jd-legal-module&quot;&gt;&lt;summary&gt;&lt;span&gt;&lt;span class=&quot;jd-legal-module-name&quot;&gt;Legales &amp;amp; aclaraciones Luaj&lt;/span&gt;&lt;span class=&quot;small muted jd-legal-module-hint&quot;&gt;12 cláusulas · Ver texto completo&lt;/span&gt;&lt;/span&gt;&lt;span class=&quot;jd-legal-chevron&quot; aria-hidden=&quot;true&quot;&gt;⌄&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;jd-legal-module-body&quot;&gt;&lt;div class=&quot;section-head&quot;&gt;&lt;p class=&quot;small muted&quot;&gt;Plantilla compartida por los productos que la tengan vinculada.&lt;/p&gt;&lt;button class=&quot;btn&quot; data-legal-edit=&quot;legal-luaj&quot; disabled=&quot;&quot;&gt;Editar texto completo&lt;/button&gt;&lt;/div&gt;&lt;div class=&quot;jd-legal-copy&quot;&gt;&lt;section&gt;&lt;h3&gt;Fotografías&lt;/h3&gt;&lt;p&gt;No están estipuladas en el presupuesto sesión de fotos o compras en banco de imágenes.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Tipografías&lt;/h3&gt;&lt;p&gt;No están estipuladas en el presupuesto la compra de tipografías.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Iso/logotipo&lt;/h3&gt;&lt;p&gt;No está estipulado en el presupuesto el diseño, creación o edición de iso/logotipo.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Confidencialidad&lt;/h3&gt;&lt;p&gt;El presente presupuesto tiene el carácter de confidencial y es propiedad exclusiva del cliente solicitante. Queda terminantemente prohibida su reproducción, publicación y/o reenvío, total o parcial, a terceros.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Portfolio&lt;/h3&gt;&lt;p&gt;El diseñador conserva el derecho no exclusivo, perpetuo y global de mostrar, reproducir y distribuir los diseños en el portfolio y el sitio web del diseñador, y en publicaciones comerciales, premios o exhibiciones de terceros, con el único fin de promover o ejemplificar el trabajo del diseñador, y el derecho a ser acreditado con la propiedad de los derechos de autor y la autoría de los diseños en relación con dicho uso.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Archivos editables&lt;/h3&gt;&lt;p&gt;No está estipulada la entrega de archivos editables, son propiedad exclusiva del diseñador.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Forma y lugar de pago&lt;/h3&gt;&lt;p&gt;La ejecución del presente contrato comenzará al abonarse el 70% del monto total en concepto de seña. Previo a la impresión, se saldará el 30% restante en un plazo máximo de 48 horas salvo estipulación en contrario pactada fehacientemente. En caso de incumplimiento (por falta de pago), el cliente incurrirá en mora de pleno derecho sin necesidad de interpelación. Los pagos se efectuarán del modo y en el lugar indicados por el oferente. Si se suspendiera la ejecución del trabajo contratado antes de su entrega final por causas imputables al cliente, éste deberá abonar al diseñador en concepto de lucro cesante el 40% del saldo restante, es decir, 12% del presupuesto completo (Complementarios al 70% de adelanto). Si se hubieran realizado tareas adicionales solicitadas por el cliente (V.gr.: modificaciones de archivos, piezas extra, gestiones fuera del alcance original, etc.), se cobrarán aparte según el valor del trabajo realizado. Para los valores en dólares (USD), solo se aceptan pagos en dólares en efectivo, por transferencia, Zelle o en USDT. Para los valores en pesos (ARS), solo se aceptan pagos en pesos argentinos en efectivo o transferencia. No se aceptan cheques.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Vigencia del precio&lt;/h3&gt;&lt;p&gt;(Solo aplica para lo presupuestado en pesos argentinos). La tarifa propuesta vence el {{vencimiento}}. Vencido el plazo de vigencia del precio sin haberse abonado la seña del presupuesto, el monto será plausible de ajuste o actualización. Efectuado el pago del 70% inicial, señalado en el punto “Forma y lugar de pago”, se dará inmediato comienzo al trabajo con el objetivo de terminar la etapa de diseño, para luego proceder a imprenta con la mayor celeridad posible. De lo contrario y ante los reiterados aumentos de precio, el costo de imprenta puede sufrir variaciones ajenas al control del diseñador.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Cancelación del proyecto y destino de los pagos efectuados&lt;/h3&gt;&lt;p&gt;Los importes abonados en concepto de seña, anticipo o pago parcial/total para el diseño, producción y/o impresión del Luaj corresponden exclusivamente al proyecto contratado y a la reserva de tiempo de trabajo, planificación y recursos destinados a su ejecución. En caso de suspensión, cancelación o interrupción del proyecto por decisión del cliente, cualquiera sea la instancia en que se encuentre, las sumas abonadas no podrán ser transferidas, imputadas, compensadas ni aplicadas a otros trabajos, productos o servicios presentes o futuros ofrecidos por el diseñador. Los pagos efectuados serán considerados como correspondientes al proyecto originalmente contratado, independientemente de su grado de avance, y no generarán créditos a favor del cliente para futuras contrataciones. Asimismo, en caso de cancelación del proyecto, los trabajos de diseño ya realizados, total o parcialmente, permanecerán bajo titularidad del diseñador y no podrán ser utilizados, reproducidos o modificados sin la correspondiente autorización.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Entrega de materiales&lt;/h3&gt;&lt;p&gt;Los plazos de diseño y producción estimados se encuentran sujetos a la recepción en tiempo y forma de los materiales necesarios para la elaboración del Luaj (publicidades, adhesiones, Leilui Nishmat, textos, logos, fotografías y demás contenidos). Las demoras en la entrega de dichos materiales por parte del cliente podrán implicar la reprogramación de los plazos de trabajo y entrega originalmente estimados, sin que ello genere responsabilidad alguna para el diseñador.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;Correcciones y modificaciones&lt;/h3&gt;&lt;p&gt;El presupuesto contempla las correcciones razonables necesarias para la adecuada elaboración del proyecto. Modificaciones sustanciales de diseño, cambios de criterio una vez aprobado un elemento, reestructuraciones generales o solicitudes adicionales posteriores al inicio del trabajo podrán presupuestarse por separado.&lt;/p&gt;&lt;/section&gt;&lt;section&gt;&lt;h3&gt;NOTA&lt;/h3&gt;&lt;p&gt;El cliente declara haber leído en su totalidad y comprendido el presente presupuesto, incluyendo la sección “DISEÑO DE HOJA ADICIONAL” y “OPCIONAL” que detalla los servicios adicionales con costo extra. Al abonar la seña, el cliente acepta expresamente dichas condiciones y reconoce que el monto abonado en concepto de seña es no reembolsable ni transferible a terceros en caso de cancelación, por cubrir trabajos ya realizados, tiempo de producción reservado y/o gastos incurridos, aun cuando no se hubiera completado la totalidad del encargo.&lt;/p&gt;&lt;/section&gt;&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;/section&gt;

&lt;script&gt;
function go(screen){document.querySelectorAll(&#x27;.screen&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x.id===screen));document.querySelectorAll(&#x27;#nav [data-screen]&#x27;).forEach(x=&gt;x.classList.toggle(&#x27;active&#x27;,x.dataset.screen===screen));document.querySelector(&#x27;.sidebar&#x27;).classList.remove(&#x27;jd-nav-open&#x27;);window.scrollTo(0,0)}
document.querySelectorAll(&#x27;#nav [data-screen]&#x27;).forEach(b=&gt;b.onclick=()=&gt;go(b.dataset.screen));
document.querySelector(&#x27;.jd-nav-toggle&#x27;).onclick=()=&gt;document.querySelector(&#x27;.sidebar&#x27;).classList.toggle(&#x27;jd-nav-open&#x27;);
document.querySelectorAll(&#x27;[data-jd-dash]&#x27;).forEach(b=&gt;b.onclick=()=&gt;go(b.dataset.jdDash===&#x27;quotes&#x27;?&#x27;savedQuotes&#x27;:b.dataset.jdDash));
document.querySelectorAll(&#x27;[data-open-qid]&#x27;).forEach(b=&gt;b.onclick=()=&gt;go(&#x27;quotes&#x27;));
window.addEventListener(&#x27;message&#x27;,event=&gt;{if(event.data&amp;&amp;event.data.screen)go(event.data.screen)});
&lt;/script&gt;&lt;/body&gt;&lt;/html&gt;"></iframe></div><script>const preview=document.getElementById('preview');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>preview.width=b.dataset.width);document.getElementById('screen').onchange=e=>preview.contentWindow.postMessage({screen:e.target.value},'*');</script></body></html>

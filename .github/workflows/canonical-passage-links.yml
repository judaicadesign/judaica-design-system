name: Canonical passage links

on:
  push:
    paths:
      - 'index.html'
      - 'package.json'
      - 'assets/jd-message-*.js'
      - 'tests/message-*.cjs'
      - 'tests/commercial-scenarios.cjs'
      - 'tests/tehilim-masters.cjs'
      - 'assets/jd-passage-links.js'
      - 'assets/jd-passage-library-ui.js'
      - 'assets/jd-tehilim-export.js'
      - 'masters/tehilim/**'
      - 'masters/bircat-hamazon/**'
      - 'masters/compositions/**'
      - 'tests/passage-link-regression.cjs'
      - 'tests/reusable-passage-library.cjs'
      - '.github/workflows/canonical-passage-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser composer syntax
        run: |
          node --check assets/jd-passage-links.js
          node --check assets/jd-passage-library-ui.js
          node --check assets/jd-tehilim-export.js
      - name: Check canonical linked Psalm references and contexts
        run: node tests/passage-link-regression.cjs
      - name: Install project dependencies
        run: npm ci
      - name: Run existing master and commercial regression suite
        run: npm test
